services:
  # Base de datos MySQL (desarrollo)
  mysql:
    image: mysql:8.0
    container_name: crm-mysql-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crm_delgado}
      MYSQL_USER: ${MYSQL_USER:-crm_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-crm_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./database/main.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - crm-network

  # Backend (desarrollo con hot reload)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: crm-backend-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-5000}
      DATABASE_URL: ${DATABASE_URL:-mysql://crm_user:crm_pass_dev_2025@mysql:3306/crm_delgado}
      SHADOW_DATABASE_URL: ${SHADOW_DATABASE_URL:-mysql://crm_user:crm_pass_dev_2025@mysql:3306/crm_delgado_shadow}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_123456}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      DNI_API_TOKEN: ${DNI_API_TOKEN}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      - mysql
    networks:
      - crm-network
    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma
      - ./server/tsconfig.json:/app/tsconfig.json
      - ./server/nodemon.json:/app/nodemon.json
      - /app/node_modules

  # Frontend (desarrollo con hot reload)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: crm-frontend-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - crm-network
    volumes:
      - ./client/app:/app/app
      - ./client/components:/app/components
      - ./client/lib:/app/lib
      - ./client/services:/app/services
      - ./client/hooks:/app/hooks
      - ./client/types:/app/types
      - ./client/schemas:/app/schemas
      - ./client/features:/app/features
      - ./client/context:/app/context
      - ./client/styles:/app/styles
      - ./client/public:/app/public
      - ./client/middleware.ts:/app/middleware.ts
      - /app/node_modules
      - /app/.next

  # Adminer - Gestor de base de datos (ligero, solo 1 archivo PHP)
  adminer:
    image: adminer:latest
    container_name: crm-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: ${ADMINER_DESIGN:-pepa-linha-dark}
    depends_on:
      - mysql
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge

volumes:
  mysql_dev_data:
    driver: local
