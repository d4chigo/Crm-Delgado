services:
  # Base de datos MySQL (desarrollo)
  mysql:
    image: mysql:8.0
    container_name: crm-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crm_delgado
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./database/main.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - crm-network

  # Backend (desarrollo con hot reload)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: crm-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: mysql://crm_user:crm_pass@mysql:3306/crm_delgado
      JWT_SECRET: dev_jwt_secret_123456
      JWT_EXPIRES_IN: 24h
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    networks:
      - crm-network
    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma
      - /app/node_modules

  # Frontend (desarrollo con hot reload)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: crm-frontend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - crm-network
    volumes:
      - ./client/app:/app/app
      - ./client/components:/app/components
      - ./client/lib:/app/lib
      - ./client/public:/app/public
      - /app/node_modules
      - /app/.next

  # Adminer - Gestor de base de datos (ligero, solo 1 archivo PHP)
  adminer:
    image: adminer:latest
    container_name: crm-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      - mysql
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge

volumes:
  mysql_dev_data:
    driver: local
