services:
  # Backend (Node.js + Express + Prisma + SQLite)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
    container_name: crm-backend
    restart: unless-stopped
    user: "0:0"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DATABASE_URL: file:/data/dev.db
      JWT_SECRET: ${JWT_SECRET:-tu_super_secreto_jwt_cambiar_en_produccion_2025}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      DNI_API_TOKEN: ${DNI_API_TOKEN:-}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-http://localhost:3000,http://localhost:8080,http://localhost:8081}
      ALLOW_DEV_SEED: "true"
    ports:
      - "5000:5000"
    networks:
      - crm-network
    volumes:
      - ./server/prisma:/app/prisma:ro
      - devdb:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Next.js)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
        NODE_ENV: ${NODE_ENV:-production}
    container_name: crm-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
      DATABASE_URL: file:/data/dev.db
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - crm-network
    volumes:
      - devdb:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PGDP (PHP + Apache) - sitio público
  pgdp:
    build:
      context: ../PGDP
      dockerfile: Dockerfile
    container_name: pgdp-php
    restart: unless-stopped
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
      JWT_SECRET: ${JWT_SECRET:-tu_super_secreto_jwt_cambiar_en_produccion_2025}
      CRM_API_BASE: ${CRM_API_BASE:-http://backend:5000/api}
    ports:
      - "8081:80"
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge
volumes:
  devdb:
