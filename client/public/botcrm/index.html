<script>
  // Inyectar API key desde el backend si está disponible
  (async () => {
    try {
      const response = await fetch('/api/config/google-api-key', { 
        credentials: 'include',
        headers: { 'Accept': 'application/json' }
      });
      if (response.ok) {
        const data = await response.json();
        if (data.apiKey) {
          window.GOOGLE_API_KEY = data.apiKey;
          console.log('[Botcrm] API key inyectada desde el backend');
        }
      }
    } catch (err) {
      console.log('[Botcrm] No se pudo obtener API key del backend:', err.message);
    }
  })();
</script>
